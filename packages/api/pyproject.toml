[project]
name = "api"
version = "0.1.0"
description = "Tiny FastAPI service exposing /version and /healthz."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
]

[project.scripts]
api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
