[project]
name = "worker"
version = "0.0.0"
description = "Tiny polling worker: ticks at a fixed interval."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worker = "worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
