[project]
name = "cli"
version = "0.1.0"
description = "Tiny click CLI: greet, ping a URL, print version."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cli = "cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
