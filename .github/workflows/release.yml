# Release pipeline: each multicz component (api / cli / worker) has its
# own tag stream and CHANGELOG.md. multicz writes pyproject.toml +
# CHANGELOG, regenerates uv.lock via the per-component `post_bump`,
# commits, tags, pushes. Then we cut one GitHub Release per new tag.

name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - run: uv sync --frozen

      - uses: goabonga/multicz-action@v1

      - name: Configure git
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          PAYLOAD=$(multicz plan --output json)
          if [ "$(echo "$PAYLOAD" | jq '.bumps | length')" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true'
        run: multicz bump --commit --tag --push

      - name: Cut a GitHub Release per bumped component
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              *-v*.*.*) ;;
              *) continue ;;
            esac
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file -
          done
